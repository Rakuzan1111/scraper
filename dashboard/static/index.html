<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rental Deal Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .filters {
            margin-bottom: 25px;
        }

        input,
        button {
            padding: 8px 12px;
            margin-right: 8px;
        }
        label {
            margin-right: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f4f4f4;
        }
    </style>
</head>

<body>

    <h1>Rental Deal Tracker</h1>

    <div class="filters">

        <label for="maxPrice">
            Maximum rent:
        </label>

        <input
            id="maxPrice"
            type="number"
            placeholder="2000"
        >

        <label for="minBedrooms">
            Minimum bedrooms:
        </label>

        <input
            id ="minBedrooms"
            type="number"
            min="0"
            placeholder="2"
        >

        <button id="applyFilter">
            Apply Filter
        </button>

        <button id="showAll">
            Show All
        </button>

    </div>

    <p id="listingCount"></p>

    <table>

        <thead>
            <tr>
                <th>Title</th>
                <th>Rent</th>
                <th>Neighborhood</th>
                <th>Bedrooms</th>
                <th>Bathrooms</th>
            </tr>
        </thead>

        <tbody id="listingRows">
        </tbody>

    </table>

    <h2>Average Rent by Neighborhood</h2>

    <canvas id="neighborhoodChart"></canvas>

    <script>

        function addCell(row, value)
        {
            const cell = document.createElement("td");

            cell.textContent = value;

            row.appendChild(cell);
        }


        async function loadListings()
        {
            const maxPrice =
                document.getElementById("maxPrice").value;

            const minBedrooms =
                document.getElementById("minBedrooms").value;

            const params =
                new URLSearchParams();

            if (maxPrice !== "")
            {
                params.append(
                    "max_price",
                    maxPrice
                );
            }

            if (minBedrooms !== "")
            {
                params.append(
                    "min_bedrooms",
                    minBedrooms
                );
            }

            let url = "/api/listings";

            if (params.toString() !== "")
            {
                url += "?" + params.toString();
            }

            const response = await fetch(url);

            const listings = await response.json();


            const tableBody =
                document.getElementById("listingRows");

            tableBody.replaceChildren();

            for (const listing of listings)
            {
                const row =
                    document.createElement("tr");

                addCell(
                    row,
                    listing.title
                );

                addCell(
                    row,
                    "$" + listing.price
                );

                addCell(
                    row,
                    listing.neighborhood
                );

                addCell(
                    row,
                    listing.bedrooms
                );

                addCell(
                    row,
                    listing.bathrooms
                );

                tableBody.appendChild(row);
            }

            document.getElementById(
                "listingCount"
            ).textContent =
                listings.length +
                " listings found";
        }

        async function loadNeighborhoodChart()
        {
            const response =
                await fetch("/api/neighborhood-averages");

            const averages =
                await response.json();

            const neighborhoods =
                averages.map(
                    item => item.neighborhood
                );

            const prices =
                averages.map(
                    item => item.averagePrice
                );

            const canvas =
                document.getElementById(
                    "neighborhoodChart"
                );

            if (!canvas)
            {
                console.error(
                "Could not find neighborhoodChart canvas."
                );

            return;
            }
            new Chart(
                canvas,
                {
                    type: "bar",

                    data: {
                        labels: neighborhoods,

                        datasets: [
                            {
                                label: "Average Rent",
                                data: prices
                            }
                        ]
                    },

                    options: {
                        responsive: true,

                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                }
            );
        }

        document.getElementById(
            "applyFilter"
        ).addEventListener(
            "click",
            loadListings
        );


        document.getElementById(
            "showAll"
        ).addEventListener(
            "click",
            function()
            {
                document.getElementById(
                    "maxPrice"
                ).value = "";

                document.getElementById(
                    "minBedrooms"
                ).value = "";
                loadListings();
            }
        );


        document.addEventListener(
            "DOMContentLoaded",
            function()
            {
                loadListings();
                loadNeighborhoodChart();
            }
);

    </script>

</body>

</html>
